<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coming Up in Boston Art</title>
<meta name="description" content="Gallery openings, talks, workshops and other art events around Boston, on a map. From Boston Art Radar and Boston Art Review's Weekly Happenings.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
/* Layout: full-height split — map on the left, a dated list on the right; stacks map-over-list on phones. */
:root {
  --bg: #f5f6f8; --panel: #ffffff; --fg: #161a22; --muted: #5d6676; --line: #e1e4ea;
  --accent: #2f45c8; --accent-soft: #e6e9fb; --soon: #d2452f; --later: #7b86a6; --event: #1f7a6d; --event-soft: #e2f2ef; --call: #9a5b00; --call-soft: #fbf0dc;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --tiles: saturate(.55) contrast(.95);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0f1218; --panel: #161a22; --fg: #e9ecf2; --muted: #98a1b3; --line: #262c38;
    --accent: #8c9cff; --accent-soft: #232a4a; --soon: #ff7a5c; --later: #8590b0; --event: #45c2ae; --event-soft: #15302c; --call: #f0b45a; --call-soft: #33270f;
    --tiles: invert(1) hue-rotate(180deg) brightness(.9) contrast(.85) saturate(.4); color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 14px/1.45 var(--body); display: grid; grid-template-rows: auto 1fr; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px;
  padding-block: 18px 14px; padding-left: max(20px, env(safe-area-inset-left)); padding-right: max(20px, env(safe-area-inset-right));
  border-bottom: 1px solid var(--line); background: var(--panel); }
h1 { font: 700 clamp(22px, 3vw, 30px)/1.05 var(--display); letter-spacing: -0.01em; margin: 0; }
.sub { color: var(--muted); margin: 4px 0 0; font-size: 13px; max-width: 60ch; }
.sub a { color: inherit; }
.controls { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font: 500 13px var(--body); border: 1px solid var(--line); background: var(--panel); color: var(--fg);
  padding: 6px 12px; border-radius: 999px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--panel); }
.chip:focus-visible, .item:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main { display: grid; grid-template-columns: minmax(0, 1fr) 400px; min-height: 0; }
#map { min-height: 0; background: var(--bg); }
aside { overflow-y: auto; border-left: 1px solid var(--line); background: var(--panel); padding-bottom: env(safe-area-inset-bottom); }
.day { position: sticky; top: 0; z-index: 1; background: var(--panel); padding: 14px 20px 6px;
  font: 600 11px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
  display: flex; justify-content: space-between; border-bottom: 1px solid var(--line); }
.day .rel { color: var(--soon); }
.item { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 12px; padding: 12px 20px; border: 0; border-bottom: 1px solid var(--line);
  cursor: pointer; background: none; width: 100%; text-align: left; color: inherit; font: inherit; }
.item:hover, .item.active { background: var(--accent-soft); }
.item.nomap { cursor: default; }
.thumb { width: 56px; height: 56px; border-radius: 6px; object-fit: cover; background: var(--line); }
.when { width: 56px; height: 56px; border-radius: 6px; display: grid; place-items: center; text-align: center;
  font: 600 12px/1.15 var(--body); background: var(--event-soft); color: var(--event); padding: 4px; }
.when.call { background: var(--call-soft); color: var(--call); }
.when.closing { background: var(--accent-soft); color: var(--accent); }
.t { font: 600 15px/1.25 var(--display); margin: 0 0 2px; text-wrap: balance; }
.tag { display: inline-block; font: 600 10.5px var(--body); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 3px; color: var(--event); }
.tag.opening { color: var(--soon); } .tag.call { color: var(--call); } .tag.closing { color: var(--accent); }
.meta { color: var(--muted); font-size: 13px; }
.meta a { color: var(--accent); }
.section { padding: 22px 20px 6px; font: 700 18px var(--display); border-bottom: 1px solid var(--line); }
.empty { padding: 28px 20px; color: var(--muted); }
footer.note { padding: 14px 20px 20px; color: var(--muted); font-size: 12px; }
footer.note a { color: inherit; }
.pin { width: 30px; height: 30px; display: grid; place-items: center; color: #fff; font: 700 12px var(--body);
  border: 2px solid var(--panel); box-shadow: 0 1px 4px rgba(0,0,0,.35); border-radius: 50%; }
.pin.soon { background: var(--soon); } .pin.later { background: var(--later); }
.pin.event { background: var(--event); border-radius: 8px; } .pin.closing { background: var(--accent); border-radius: 8px; }
.leaflet-tile-pane { filter: var(--tiles); }
.leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--panel); color: var(--fg); }
.leaflet-popup-content { margin: 12px 14px; font: 13px/1.4 var(--body); max-width: 270px; max-height: 340px; overflow-y: auto; }
.pop h3 { font: 700 15px/1.2 var(--display); margin: 0 0 2px; }
.pop .v { color: var(--muted); margin-bottom: 8px; }
.pop .show + .show { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 8px; }
.pop .show b { display: block; font-weight: 600; }
.pop a { color: var(--accent); }
.leaflet-container { font-family: var(--body); }
.leaflet-container a.leaflet-popup-close-button { color: var(--muted); }
@media (max-width: 760px) {
  main { grid-template-columns: 1fr; grid-template-rows: 52vh auto; }
  html, body { height: auto; }
  aside { border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
  .controls { align-items: flex-start; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<header>
  <div>
    <h1>Coming Up in Boston Art</h1>
    <p class="sub">Openings from <a href="https://artradar.org/calendar" target="_blank" rel="noopener">Boston Art Radar</a> and events from Boston Art Review’s <a href="https://www.bostonartreview.com/weekly-happenings" target="_blank" rel="noopener">Weekly Happenings</a>. <a id="cal" href="calendar.ics">Subscribe in your calendar</a></p>
  </div>
  <div class="controls">
    <div class="chips" role="group" aria-label="What to show">
      <button class="chip" id="k-all" data-kind="all">Everything</button>
      <button class="chip" id="k-openings" data-kind="openings">Openings</button>
      <button class="chip" id="k-events" data-kind="events">Events</button>
      <button class="chip" id="k-calls" data-kind="calls">Open calls</button>
    </div>
    <div class="chips" role="group" aria-label="How far ahead">
      <button class="chip" id="r7" data-days="7">Next 7 days</button>
      <button class="chip" id="r14" data-days="14">Next 2 weeks</button>
      <button class="chip" id="r30" data-days="30">Next 30 days</button>
    </div>
  </div>
</header>
<main>
  <div id="map" role="region" aria-label="Map"></div>
  <aside id="list" aria-label="Openings and events by date"></aside>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
document.getElementById('cal').href = (location.protocol === 'https:' ? 'webcal://' + location.host + location.pathname.replace(/[^/]*$/, '') : '') + 'calendar.ics';
const map = L.map('map').setView([42.36, -71.08], 12);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors' }).addTo(map);

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clean = s => (s || '').replace(/\*\*|__|[#>`]/g, '').trim();
const d = iso => new Date(iso + 'T12:00:00');
const fmtDay = iso => d(iso).toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
const fmtShort = iso => d(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
const todayISO = () => new Date().toLocaleDateString('en-CA', { timeZone: 'America/New_York' });
const daysFrom = iso => Math.round((d(iso) - d(todayISO())) / 864e5);
const rel = n => n === 0 ? 'today' : n === 1 ? 'tomorrow' : `in ${n} days`;
const dirLink = q => `<a href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(q)}" target="_blank" rel="noopener">Directions</a>`;
const startTime = t => { const m = (t || '').match(/(\d{1,2}(?::\d{2})?)\s*(AM|PM)?/i); if (!m) return ''; return m[1] + (m[2] || (t.match(/(AM|PM)/i) || [])[1] || '').toLowerCase(); };

let range = 14, kind = 'all', openings = [], bar = { events: [], closings: [], opencalls: [], articles: [] }, updated = null;
try { const r = Number(localStorage.getItem('range')); if ([7, 14, 30].includes(r)) range = r; const k = localStorage.getItem('kind'); if (['all', 'openings', 'events', 'calls'].includes(k)) kind = k; } catch {}
const layer = L.layerGroup().addTo(map), markers = new Map();

// Everything that lands on a date, in one shape
function entries() {
  const inRange = iso => daysFrom(iso) >= 0 && daysFrom(iso) <= range;
  const out = [];
  if (kind === 'all' || kind === 'openings') for (const o of openings) if (inRange(o.opens))
    out.push({ id: o.id, type: 'opening', date: o.opens, title: o.title, venue: o.venue, place: o.neighborhood, lat: o.lat, lng: o.lng, url: o.url, image: o.image,
      blurb: clean(o.blurb), closes: o.closes, reception: o.reception, address: o.address });
  if (kind === 'all' || kind === 'events') {
    for (const e of bar.events) { const day = e.start < todayISO() && e.end >= todayISO() ? todayISO() : e.start; if (!inRange(day)) continue;
      if (kind === 'all' && e.show && openings.some(o => o.id === e.show && inRange(o.opens) && o.opens === e.start)) continue;   // shown with its opening
      out.push({ id: e.id, type: 'event', date: day, title: e.title, category: e.category, time: e.time, venue: e.presenter, place: e.online ? 'Online' : e.location,
        lat: e.lat, lng: e.lng, url: e.url, blurb: e.description, online: e.online, address: e.location, end: e.end }); }
    for (const c of bar.closings) if (inRange(c.end))
      out.push({ id: c.id, type: 'closing', date: c.end, title: c.title, venue: c.venue, place: c.location, lat: c.lat, lng: c.lng, url: c.url, blurb: c.description, address: c.location });
  }
  return out.sort((a, b) => a.date.localeCompare(b.date));
}

function render() {
  document.querySelectorAll('[data-days]').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.days === range)));
  document.querySelectorAll('[data-kind]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.kind === kind)));
  const list = document.getElementById('list');
  const items = kind === 'calls' ? [] : entries();

  layer.clearLayers(); markers.clear();
  const spots = new Map();
  for (const it of items) if (it.lat != null) { const k = it.lat.toFixed(4) + ',' + it.lng.toFixed(4); (spots.get(k) || spots.set(k, []).get(k)).push(it); }
  for (const its of spots.values()) {
    const f = its[0], cls = f.type === 'opening' ? (daysFrom(f.date) <= 7 ? 'soon' : 'later') : f.type;
    const icon = L.divIcon({ className: '', iconSize: [30, 30], iconAnchor: [15, 15], html: `<div class="pin ${cls}">${d(f.date).getDate()}</div>` });
    const m = L.marker([f.lat, f.lng], { icon, keyboard: true, title: f.venue || f.title }).addTo(layer);
    m.bindPopup(`<div class="pop"><h3>${esc(f.type === 'opening' ? f.venue : (f.venue || f.title))}</h3><div class="v">${esc((f.address || f.place || '').replace(/, USA$/, ''))}</div>` +
      its.map(it => `<div class="show"><span class="tag ${it.type}">${esc(it.type === 'opening' ? 'Opening' : it.type === 'closing' ? 'Last day' : it.category)}</span><b>${esc(it.title)}</b>` +
        `${esc(fmtDay(it.date))} (${rel(daysFrom(it.date))})${it.time ? ', ' + esc(it.time) : ''}` +
        `${it.reception ? `<br>Reception ${esc(fmtDay(it.reception.date))}${it.reception.time ? ', ' + esc(it.reception.time) : ''}` : ''}${it.closes ? `<br>Through ${esc(fmtShort(it.closes))}` : ''}` +
        `${it.blurb ? '<br>' + esc(it.blurb.slice(0, 220)) : ''}<br><a href="${esc(it.url)}" target="_blank" rel="noopener">Details</a> · ${dirLink(it.address || it.venue)}</div>`).join('') + '</div>');
    its.forEach(it => markers.set(it.id, m));
  }
  const pts = items.filter(i => i.lat != null).map(i => [i.lat, i.lng]);
  const near = pts.filter(([a, b]) => Math.abs(a - 42.36) < .2 && Math.abs(b + 71.08) < .3);   // frame Greater Boston; far-off pins stay reachable by zooming out
  if (near.length) map.fitBounds(near, { padding: [40, 40], maxZoom: 14 }); else if (pts.length) map.fitBounds(pts, { padding: [40, 40], maxZoom: 12 });

  let html = '';
  if (kind !== 'calls') {
    if (!items.length) html += `<p class="empty">Nothing listed in the next ${range} days. Try a longer range.</p>`;
    const byDay = items.reduce((acc, i) => ((acc[i.date] ||= []).push(i), acc), {});
    for (const [day, its] of Object.entries(byDay)) {
      html += `<div class="day"><span>${esc(fmtDay(day))}</span><span class="${daysFrom(day) <= 7 ? 'rel' : ''}">${rel(daysFrom(day))}</span></div>`;
      for (const it of its) {
        const lead = it.type === 'opening' ? (it.image ? `<img class="thumb" src="${esc(it.image)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : '<span class="thumb"></span>')
          : `<span class="when ${it.type}">${it.type === 'closing' ? 'Last<br>day' : esc(startTime(it.time) || 'All day')}</span>`;
        const tag = it.type === 'opening' ? 'Opening' : it.type === 'closing' ? 'Last day' : it.category;
        const sub = it.type === 'opening'
          ? `${esc(it.venue)}${it.place ? ' · ' + esc(it.place) : ''}${it.reception ? `<br>Reception ${esc(fmtShort(it.reception.date))}${it.reception.time ? ', ' + esc(it.reception.time) : ''}` : ''}${it.closes ? '<br>Through ' + esc(fmtShort(it.closes)) : ''}`
          : `${it.time ? esc(it.time) + ' · ' : ''}${esc(it.place || '')}${it.venue ? '<br>' + esc(it.venue) : ''}${it.lat == null ? `<br><a href="${esc(it.url)}" target="_blank" rel="noopener">Details</a>` : ''}`;
        html += `<button class="item${it.lat == null ? ' nomap' : ''}" data-id="${esc(it.id)}">${lead}<span><span class="tag ${it.type}">${esc(tag)}</span><p class="t">${esc(it.title)}</p><span class="meta">${sub}</span></span></button>`;
      }
    }
  }
  if ((kind === 'all' || kind === 'calls') && bar.opencalls.length) {
    html += `<div class="section">Open calls</div>` + bar.opencalls.map(c => `<a class="item nomap" style="text-decoration:none" href="${esc(c.url)}" target="_blank" rel="noopener"><span class="when call">Due<br>${esc(fmtShort(c.deadline))}</span><span><span class="tag call">${esc(rel(daysFrom(c.deadline)))}</span><p class="t">${esc(c.title)}</p><span class="meta">${esc((c.description || '').slice(0, 180))}${(c.description || '').length > 180 ? '…' : ''}</span></span></a>`).join('');
  }
  if (kind === 'all' && bar.articles.length) {
    html += `<div class="section">New from Boston Art Review</div>` + bar.articles.map(a => `<a class="item nomap" style="text-decoration:none;grid-template-columns:1fr" href="${esc(a.url)}" target="_blank" rel="noopener"><span><span class="tag">${esc(a.type)}</span><p class="t">${esc(a.title)}</p>${a.byline ? `<span class="meta">By ${esc(a.byline)}</span>` : ''}</span></a>`).join('');
  }
  html += `<footer class="note">${updated ? 'Updated ' + esc(new Date(updated).toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' })) + '. ' : ''}Listings come from <a href="https://artradar.org/calendar" target="_blank" rel="noopener">artradar.org</a> and <a href="https://www.bostonartreview.com/weekly-happenings" target="_blank" rel="noopener">Weekly Happenings</a>; check the source before you go.</footer>`;
  list.innerHTML = html;
  list.querySelectorAll('button.item').forEach(b => b.addEventListener('click', () => {
    const m = markers.get(b.dataset.id); if (!m) return;
    list.querySelectorAll('.item.active').forEach(x => x.classList.remove('active')); b.classList.add('active');
    map.setView(m.getLatLng(), Math.max(map.getZoom(), 14)); m.openPopup();
    if (matchMedia('(max-width: 760px)').matches) document.getElementById('map').scrollIntoView({ behavior: 'smooth' });
  }));
}
document.querySelectorAll('[data-days]').forEach(b => b.addEventListener('click', () => { range = +b.dataset.days; try { localStorage.setItem('range', range); } catch {} render(); }));
document.querySelectorAll('[data-kind]').forEach(b => b.addEventListener('click', () => { kind = b.dataset.kind; try { localStorage.setItem('kind', kind); } catch {} render(); }));
Promise.all([
  fetch('data/openings.json', { cache: 'no-cache' }).then(r => r.ok ? r.json() : null).catch(() => null),
  fetch('data/bar.json', { cache: 'no-cache' }).then(r => r.ok ? r.json() : null).catch(() => null),
]).then(([o, b]) => {
  if (!o && !b) { document.getElementById('list').innerHTML = '<p class="empty">Couldn’t load the listings. Refresh to try again.</p>'; return; }
  if (o) { openings = o.openings; updated = o.updated; }
  if (b) { bar = b; updated = updated && updated > b.updated ? updated : b.updated; }
  render();
});
</script>
</body>
</html>
